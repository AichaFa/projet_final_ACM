# ============================================================================
# Monitoring de dérive sémantique - planifié + rapport HTML publié en Artifact
# ----------------------------------------------------------------------------
# Lit les embeddings déjà calculés dans le datalake Azure (référence + production)
# et mesure la dérive sémantique. Léger : pas de PyTorch, pas de BioViL-T.
# ============================================================================

name: Monitoring de dérive (planifié)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  monitoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pandas "evidently==0.7.21" azure-storage-blob python-dotenv

      - name: Lancer le monitoring de dérive sémantique
        run: python monitoring.py

      - name: Publier le rapport de dérive (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-derive
          path: monitoring/rapports/
