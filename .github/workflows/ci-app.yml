name: CI - App

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  workflow_dispatch:

jobs:
  ci-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Vérifier le style (black)
        run: |
          pip install black
          black --check --diff . | tee black-report.txt

      - name: Publier le rapport black
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-black-app
          path: app/black-report.txt

      - name: Lancer les tests
        run: |
          pip install pytest
          pytest -v

      - name: Alerte Slack si échec
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI App en échec : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}