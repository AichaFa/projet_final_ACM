# ============================================================================
# Déploiement de l'App vers Hugging Face - AUTOMATIQUE (sur push) + manuel
# ----------------------------------------------------------------------------
# Se déclenche automatiquement à chaque push touchant app/ (ou ce fichier),
# et reste lançable à la main. Il vérifie d'abord le test de l'app :
# si le test échoue, le déploiement ne se fait pas.
# ============================================================================

name: Déploiement App (auto)

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Vérifier les tests de l'app (contrôle avant déploiement)
        run: |
          pip install pytest
          cd app && pytest -v

      - name: Déployer vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import HfApi; import os; HfApi().upload_folder(folder_path='app', repo_id='AichaFaHugFace/Auditeur-App-Gradio', repo_type='space', token=os.environ['HF_TOKEN'], commit_message='Deploiement automatique depuis projet_final_ACM')"
          echo "Déploiement terminé -> https://huggingface.co/spaces/AichaFaHugFace/Auditeur-App-Gradio"